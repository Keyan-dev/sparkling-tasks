<div class="h-screen flex flex-col items-center justify-center w-full">
    <div class="max-w-sm p-6 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700">
      <div class="flex items-center justify-between w-full mb-1">
        <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Sparkling Tasks!</h5>
        <p class="mb-2 text-gray-900 text-xl font-bold text-md dark:text-white">{{toDoStore.todos().length}}</p>
      </div>
      <p class="mb-3 font-normal text-gray-700 dark:text-gray-400">A client-side task management application utilizing local storage for data persistence.</p>
      <div class="flex items-center justify-center content-center gap-2 mt-3">
        <input type="text" id="first_name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-300 focus:border-purple-300 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-purple-500 dark:focus:border-purple-500" placeholder="Enter your task" 
        [(ngModel)]="taskValue" required />
        <button type="button" [disabled]="!taskValue" class="text-white bg-gradient-to-r from-purple-500 via-purple-600 to-purple-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-purple-300 dark:focus:ring-purple-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center hover:cursor-pointer disabled:bg-gray-300  cursor-none" (click)="addTask()">Add</button>
      </div>
      <div class="flex flex-col items-start justify-center p-3">
      @for(task of toDoStore.todos();track $index){
        <div class="flex items-center">
          <input id="checked-checkbox"  [checked]="task.completed" type="checkbox" value="" class="w-4 h-4 text-purple-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-purple-500 dark:focus:ring-purple-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" (change)="toggleTodo(task.id)">
          <label for="checked-checkbox" class="ms-2 text-md font-medium text-gray-900 dark:text-gray-300" [ngClass]="{'line-through':task.completed}">{{task.title}}</label>
      </div>
      }
      </div>
    </div>
</div>
